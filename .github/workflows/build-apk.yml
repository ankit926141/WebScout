# To enable automated Android APK builds on GitHub Actions:
# After exporting to your GitHub repository, create a file at: .github/workflows/build-apk.yml
# and paste the content below:

name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Capacitor Android Platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --no-audit
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          # Exclude legacy kotlin-stdlib-jdk7/8 to resolve duplicate classes with kotlin-stdlib 1.8+
          cat << 'EOF' >> android/app/build.gradle

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
EOF

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webscout-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
